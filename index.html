<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Ciclo V1</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--a:#635bff;--bad:#b42318;--ok:#027a48}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}header{height:62px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}.wrap{display:flex;min-height:calc(100vh - 62px)}aside{width:220px;background:#fff;border-right:1px solid var(--line);padding:14px}nav button{width:100%;text-align:left;border:0;background:none;padding:11px;border-radius:8px;margin:3px 0;cursor:pointer}nav button.active,nav button:hover{background:#eef0ff;color:#4338ca;font-weight:600}main{flex:1;padding:22px;max-width:1400px;width:100%;margin:auto}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 2px 8px #00000008}.metric{font-size:27px;font-weight:700}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.btn{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;background:var(--a);color:#fff;font-weight:600}.btn.secondary{background:#eef0ff;color:#4338ca}.btn.ghost{background:#fff;color:#172033;border:1px solid #d0d5dd}.btn.danger{background:#fee4e2;color:#b42318}input,select,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;font:inherit}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.span2{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{font-size:12px;color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef0ff;color:#4338ca;font-size:12px}.badge.ok{background:#ecfdf3;color:#027a48}.badge.warn{background:#fffaeb;color:#b54708}.notice{padding:12px 14px;background:#fffaeb;border:1px solid #fedf89;border-radius:9px;margin-bottom:15px}.empty{text-align:center;color:var(--muted);padding:25px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{font-size:12px;color:var(--muted);font-weight:700;padding:5px}.day{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:82px;padding:6px;font-size:12px}.day.other{opacity:.45}.period{color:#b42318}.ovul{color:#7a5af8}.fert{color:#027a48}.next{color:#b54708}.dot{margin-top:4px;font-size:10px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}aside{width:180px}}@media(max-width:600px){.wrap{display:block}aside{width:100%;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow:auto}nav button{width:auto;white-space:nowrap}.cards,.formgrid{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><header><b>CRM Ciclo · V1</b><span id="clock"></span></header><div class="wrap"><aside><nav id="nav"><button data-v="dash">📊 Dashboard</button><button data-v="clients">👥 Clientas</button><button data-v="cal">📅 Calendario</button><button data-v="data">⚙️ Datos</button></nav></aside><main id="app"></main></div><script>
const K='crm_ciclo_v1';let S=JSON.parse(localStorage.getItem(K)||'{"clients":[],"records":[]}');const $=s=>document.querySelector(s),iso=d=>{let x=new Date(d);return isNaN(x)?null:x.toISOString().slice(0,10)},add=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)},diff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000),fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-DO'): '—',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function save(){localStorage.setItem(K,JSON.stringify(S))}function C(id){return S.clients.find(x=>x.id===id)}function R(id){return S.records.filter(x=>x.clientId===id).sort((a,b)=>a.start.localeCompare(b.start))}
function calc(id){let rs=R(id);if(!rs.length)return null;let st=rs.map(x=>x.start).sort(),ls=[];for(let i=1;i<st.length;i++){let n=diff(st[i-1],st[i]);if(n>10&&n<90)ls.push(n)}let avg=ls.length?ls.reduce((a,b)=>a+b,0)/ls.length:null,last=st.at(-1);if(!avg)return{last,ls};let next=add(last,Math.round(avg)),ov=add(next,-14),v=ls.length>=4?Math.sqrt(ls.reduce((s,n)=>s+(n-avg)**2,0)/ls.length):null;let conf=ls.length>=4?(v<=2?'consistent':v<=4?'moderate':'limited'):ls.length>=2?'moderate':'limited';return{last,ls,avg,next,ov,fstart:add(ov,-5),fend:add(ov,1),conf}}
function view(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));({dash:dash,clients:clients,cal:calendar,data:data}[v])()}
function dash(){let total=S.clients.length,active=S.clients.filter(c=>c.status!=='inactive').length,ps=S.clients.map(c=>({c,p:calc(c.id)})).filter(x=>x.p?.next).sort((a,b)=>a.p.next.localeCompare(b.p.next)).slice(0,8);$('#app').innerHTML=`<h1>Dashboard</h1><div class="notice"><b>Importante:</b> las fechas son estimaciones y no constituyen diagnóstico ni método anticonceptivo. Diseñado para clientas adultas.</div><div class="grid cards"><div class="card"><div class="muted">Clientas</div><div class="metric">${total}</div></div><div class="card"><div class="muted">Activas</div><div class="metric">${active}</div></div><div class="card"><div class="muted">Con historial</div><div class="metric">${S.clients.filter(c=>S.records.some(r=>r.clientId===c.id)).length}</div></div><div class="card"><div class="muted">Sin estimación</div><div class="metric">${S.clients.filter(c=>!calc(c.id)?.next).length}</div></div></div><div class="card" style="margin-top:15px"><h2>Próximas estimaciones</h2>${ps.length?`<table class="table"><tr><th>Clienta</th><th>Menstruación aprox.</th><th>Ovulación aprox.</th><th>Confianza</th></tr>${ps.map(x=>`<tr><td>${esc(x.c.code)} · ${esc(x.c.name)}</td><td>${fmt(x.p.next)}</td><td>${fmt(x.p.ov)}</td><td><span class="badge ${x.p.conf==='consistent'?'ok':x.p.conf==='moderate'?'warn':''}">${x.p.conf}</span></td></tr>`).join('')}</table>`:'<div class="empty">Registra dos o más inicios de menstruación para calcular un promedio.</div>'}</div>`}
function clients(){let q='';$('#app').innerHTML=`<div class="toolbar"><input id="q" style="flex:1;min-width:220px" placeholder="🔎 Buscar nombre, ID o teléfono"><button class="btn" id="new">+ Nueva clienta</button></div><div class="card"><table class="table"><thead><tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Estado</th><th>Estimación</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`;function fill(){q=$('#q').value.toLowerCase();let a=S.clients.filter(c=>(c.name+' '+c.code+' '+(c.phone||'')).toLowerCase().includes(q));$('#rows').innerHTML=a.length?a.map(c=>{let p=calc(c.id);return `<tr><td>${esc(c.code)}</td><td>${esc(c.name)}</td><td>${esc(c.phone||'')}</td><td><span class="badge ${c.status==='inactive'?'warn':'ok'}">${c.status==='inactive'?'Inactiva':'Activa'}</span></td><td>${p?.next?fmt(p.next):'Sin datos'}</td><td><button class="btn secondary" onclick="profile('${c.id}')">Abrir</button></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">No hay clientas.</td></tr>'}$('#q').oninput=fill;$('#new').onclick=()=>formClient();fill()}
function formClient(id){let c=id?C(id):{name:'',phone:'',email:'',birth:'',status:'active',notes:''};$('#app').innerHTML=`<div class="toolbar"><button class="btn ghost" onclick="view('clients')">← Volver</button></div><div class="card"><h2>${id?'Editar':'Nueva'} clienta</h2><form id="f"><div class="formgrid"><div class="field"><label>Nombre *</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>Teléfono</label><input name="phone" value="${esc(c.phone||'')}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(c.email||'')}"></div><div class="field"><label>Fecha de nacimiento</label><input name="birth" type="date" value="${esc(c.birth||'')}"></div><div class="field"><label>Estado</label><select name="status"><option value="active" ${c.status==='active'?'selected':''}>Activa</option><option value="inactive" ${c.status==='inactive'?'selected':''}>Inactiva</option></select></div><div class="field span2"><label>Notas</label><textarea name="notes">${esc(c.notes||'')}</textarea></div></div><button class="btn">Guardar</button></form></div>`;$('#f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(id)Object.assign(C(id),{name:f.get('name'),phone:f.get('phone'),email:f.get('email'),birth:f.get('birth'),status:f.get('status'),notes:f.get('notes')});else{let n=S.clients.length+1;S.clients.push({id:crypto.randomUUID(),code:'CL-'+String(n).padStart(6,'0'),name:f.get('name'),phone:f.get('phone'),email:f.get('email'),birth:f.get('birth'),status:f.get('status'),notes:f.get('notes')})}save();view('clients')}}
function profile(id){let c=C(id),rs=R(id),p=calc(id);$('#app').innerHTML=`<div class="toolbar"><button class="btn ghost" onclick="view('clients')">← Clientes</button><button class="btn" onclick="formRecord('${id}')">+ Registrar menstruación</button><button class="btn secondary" onclick="formClient('${id}')">Editar</button></div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="muted">Clienta</div><h2>${esc(c.name)}</h2><div>${esc(c.code)} · ${esc(c.phone||'')}</div></div><div class="card"><div class="muted">Último inicio</div><div class="metric">${p?fmt(p.last):'—'}</div></div><div class="card"><div class="muted">Promedio</div><div class="metric">${p?.avg?p.avg.toFixed(1)+' d':'—'}</div></div></div><div class="card" style="margin-top:15px"><h2>Estimación</h2>${p?.next?`<div class="formgrid"><div><b>Próxima menstruación aprox.</b><p>${fmt(p.next)}</p></div><div><b>Ovulación aprox.</b><p>${fmt(p.ov)}</p></div><div><b>Ventana fértil estimada</b><p>${fmt(p.fstart)} – ${fmt(p.fend)}</p></div><div><b>Confianza</b><p><span class="badge ${p.conf==='consistent'?'ok':p.conf==='moderate'?'warn':''}">${p.conf}</span></p></div></div>`:'<div class="empty">Se necesitan al menos dos inicios de menstruación válidos.</div>'}</div><div class="card" style="margin-top:15px"><h2>Historial</h2>${rs.length?`<table class="table"><tr><th>Inicio</th><th>Fin</th><th></th></tr>${rs.map(r=>`<tr><td>${fmt(r.start)}</td><td>${fmt(r.end)}</td><td><button class="btn danger" onclick="delRec('${r.id}','${id}')">Eliminar</button></td></tr>`).join('')}</table>`:'<div class="empty">Sin registros.</div>'}</div>`}
function formRecord(id){$('#app').innerHTML=`<div class="toolbar"><button class="btn ghost" onclick="profile('${id}')">← Volver</button></div><div class="card"><h2>Registrar menstruación</h2><div class="notice">Registra el primer día del sangrado menstrual. La fecha final es opcional.</div><form id="r"><div class="formgrid"><div class="field"><label>Inicio *</label><input name="start" type="date" required max="${iso(new Date())}"></div><div class="field"><label>Fin</label><input name="end" type="date"></div><div class="field span2"><label>Notas</label><textarea name="notes"></textarea></div></div><button class="btn">Guardar</button></form></div>`;$('#r').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),s=f.get('start'),en=f.get('end');if(en&&en<s)return alert('La fecha final no puede ser anterior al inicio.');if(S.records.some(r=>r.clientId===id&&r.start===s))return alert('Ya existe un registro con esa fecha.');S.records.push({id:crypto.randomUUID(),clientId:id,start:s,end:en,notes:f.get('notes')});save();profile(id)}}function delRec(r,c){if(confirm('¿Eliminar este registro?')){S.records=S.records.filter(x=>x.id!==r);save();profile(c)}}
function calendar(){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),start=1-first.getDay(),cells='';for(let i=0;i<42;i++){let d=new Date(y,m,start+i),ds=iso(d),tags=[];S.records.filter(r=>r.start===ds).forEach(()=>tags.push('<div class="dot period">● Menstruación</div>'));S.clients.forEach(c=>{let p=calc(c.id);if(p?.ov===ds)tags.push(`<div class="dot ovul">● Ovulación ${esc(c.code)}</div>`);if(p?.fstart<=ds&&ds<=p?.fend)tags.push(`<div class="dot fert">● Ventana ${esc(c.code)}</div>`);if(p?.next===ds)tags.push(`<div class="dot next">● Próxima ${esc(c.code)}</div>`)});cells+=`<div class="day ${d.getMonth()===m?'':'other'}"><b>${d.getDate()}</b>${tags.slice(0,4).join('')}</div>`}$('#app').innerHTML=`<h1>Calendario · ${now.toLocaleDateString('es-DO',{month:'long',year:'numeric'})}</h1><div class="notice">Los eventos estimados pueden variar y no determinan con certeza fechas biológicas.</div><div class="card"><div class="calendar">${['D','L','M','X','J','V','S'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`}
function data(){$('#app').innerHTML=`<h1>Datos y respaldo</h1><div class="grid" style="grid-template-columns:repeat(2,1fr)"><div class="card"><h2>Exportar</h2><p>Guarda una copia JSON de los datos locales.</p><button class="btn" id="ex">Exportar JSON</button></div><div class="card"><h2>Importar</h2><input type="file" id="im" accept=".json,application/json"></div><div class="card"><h2>Almacenamiento</h2><p>V1 local: los datos quedan en este navegador y no se sincronizan.</p></div><div class="card"><h2>Borrar</h2><button class="btn danger" id="clear">Borrar todos los datos</button></div></div>`;$('#ex').onclick=()=>{let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='crm-ciclo-backup.json';a.click()};$('#im').onchange=e=>{let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.clients)||!Array.isArray(x.records))throw 0;S=x;save();alert('Importación completada.');view('dash')}catch{alert('JSON no válido.')}};r.readAsText(f)};$('#clear').onclick=()=>{if(confirm('¿Borrar todos los datos locales?')){S={clients:[],records:[]};save();view('dash')}}}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));setInterval(()=>$('#clock').textContent=new Date().toLocaleString('es-DO'),1000);view('dash');
</script></body></html>
